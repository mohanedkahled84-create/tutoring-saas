  <!-- Legacy & Low-End Mobile Browser Polyfills & Resilience Engine -->
  <script>
    if (typeof globalThis === 'undefined') { window.globalThis = window; }
    if (!Promise.allSettled) {
      Promise.allSettled = function(promises) {
        return Promise.all(promises.map(function(p) {
          return Promise.resolve(p).then(
            function(val) { return { status: 'fulfilled', value: val }; },
            function(err) { return { status: 'rejected', reason: err }; }
          );
        }));
      };
    }
    if (!window.requestIdleCallback) {
      window.requestIdleCallback = function(cb) {
        return setTimeout(function() { cb({ didTimeout: false, timeRemaining: function() { return 0; } }); }, 1);
      };
      window.cancelIdleCallback = function(id) { clearTimeout(id); };
    }

    window.__centrlyLoaded = false;
    (function() {
      function showFallback(msg) {
        if (window.__centrlyLoaded) return;
        var actions = document.getElementById('centrlySplashActions');
        var status = document.getElementById('centrlySplashStatus');
        if (actions) actions.style.display = 'block';
        if (status && msg) status.innerText = msg;
        var chromeBtn = document.getElementById('centrlyOpenInChromeBtn');
        if (chromeBtn) {
          var cleanHref = window.location.href.replace(/^https?:\/\//, '');
          chromeBtn.href = 'intent://' + cleanHref + '#Intent;scheme=https;package=com.android.chrome;end';
        }
      }

      // Show recovery actions if loading takes more than 7 seconds on weak device/network
      setTimeout(function() {
        showFallback('يستغرق التحميل وقتاً إضافياً...');
      }, 7000);

      window.addEventListener('error', function(e) {
        if (!window.__centrlyLoaded) {
          showFallback('تنبيه: متصفحك يواجه صعوبة في تشغيل الصفحة');
        }
      });
    })();
  </script>
