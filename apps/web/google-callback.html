<style>
body{margin:0;background:var(--centrly-bg,#f8fafc);color:var(--centrly-ink);font-family:Cairo,Tahoma,Arial,sans-serif}.google-auth-shell{min-height:100dvh;display:grid;place-items:center;padding:24px 16px;box-sizing:border-box}.google-auth-card{width:100%;max-width:480px;min-width:0;box-sizing:border-box;padding:28px;background:#fff;border:1px solid var(--centrly-line);border-radius:20px;box-shadow:0 12px 40px #172d7008}.google-auth-heading{text-align:center;margin-bottom:20px}.google-auth-heading img{border-radius:12px}.google-auth-heading h1{font-size:1.5rem;margin:12px 0 8px}.google-auth-heading p,.google-field-help{color:var(--centrly-text);font-size:.85rem;line-height:1.8}.google-verified-email{padding:10px 12px;background:var(--centrly-bg,#f8fafc);border:1px solid var(--centrly-line);border-radius:10px;text-align:center;overflow-wrap:anywhere;margin-bottom:20px;font-size:.85rem}.google-stage-group{padding:0;border:0;margin:0 0 20px}.google-stage-group legend{font-weight:700;font-size:.9rem;margin-bottom:10px}.google-stage-group legend span{display:block;font-size:.75rem;font-weight:400;color:var(--centrly-text);margin-top:4px}.google-stage-options{display:grid;grid-template-columns:1fr 1fr;gap:8px}.google-stage-options label{min-height:44px;display:flex;align-items:center;gap:8px;padding:8px 10px;box-sizing:border-box;border:1px solid var(--centrly-line);border-radius:10px;font-size:.85rem;cursor:pointer}.google-stage-options label:has(:checked){border-color:var(--centrly-blue-700);background:#f5f7ff}.google-terms{display:flex;gap:10px;align-items:flex-start;font-size:.8rem;line-height:1.8;margin:20px 0}.google-terms input{margin-top:5px}.google-complete{min-height:48px;width:100%;box-sizing:border-box;display:flex;align-items:center;justify-content:center;text-decoration:none}.google-back{display:block;text-align:center;color:var(--centrly-text);font-size:.8rem;margin-top:20px}#googleProfileError{padding:12px;border:1px solid #fecaca;border-radius:10px;background:#fef2f2;color:#991b1b;font-size:.85rem;line-height:1.8;margin-bottom:16px}.google-auth-card input:focus-visible,.google-auth-card a:focus-visible{outline:2px solid var(--centrly-blue-700);outline-offset:3px}@media(max-width:360px){.google-auth-card{padding:20px}.google-auth-heading h1{font-size:1.3rem}}
