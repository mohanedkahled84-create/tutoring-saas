name: CI & Live Security Test Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Backend Test Suite & Live Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        working-directory: apps/tutoring
        run: npm ci

      - name: Verify TypeScript Compilation
        working-directory: apps/tutoring
        run: npm run build

      - name: Run Backend Tests & Live Security Audit
        working-directory: apps/tutoring
        env:
          SUPABASE_TEST_URL: ${{ secrets.SUPABASE_TEST_URL }}
          SUPABASE_TEST_ANON_KEY: ${{ secrets.SUPABASE_TEST_ANON_KEY }}
          SUPABASE_TEST_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_TEST_SERVICE_ROLE_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_TEST_URL || secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_TEST_ANON_KEY || secrets.SUPABASE_ANON_KEY }}
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'ci-test-jwt-secret-min-32-chars-long-centrly' }}
          NODE_ENV: test
        run: npm test

      - name: Verify No Raw SQL Interpolation
        run: |
          echo "Scanning for raw SQL string interpolation in application code..."
          if grep -rnE "(\`.*(SELECT|INSERT|UPDATE|DELETE).*\`|\$\{.*(SELECT|INSERT|UPDATE|DELETE))" apps/tutoring/src/; then
            echo "ERROR: Potential unparameterized SQL interpolation detected!"
            exit 1
          else
            echo "PASS: Zero unparameterized SQL interpolation found across codebase."
          fi
