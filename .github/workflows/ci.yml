name: CI & Live Security Test Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Backend Test Suite & Live Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        working-directory: apps/tutoring
        run: npm ci

      - name: Audit dependencies
        working-directory: apps/tutoring
        run: npm audit --audit-level=moderate

      - name: Verify parent entry bundle
        working-directory: apps/tutoring
        run: npm run build:parent-entry -- --check

      - name: Verify TypeScript Compilation
        working-directory: apps/tutoring
        run: npm run build

      - name: Run Backend Tests & Live Security Audit
        working-directory: apps/tutoring
        env:
          SUPABASE_TEST_URL: ${{ secrets.SUPABASE_TEST_URL }}
          SUPABASE_TEST_ANON_KEY: ${{ secrets.SUPABASE_TEST_ANON_KEY }}
          SUPABASE_TEST_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_TEST_SERVICE_ROLE_KEY }}
          # Project refs are identifiers, not credentials. Keep this aligned
          # with the dedicated test project; never fall back to production.
          SUPABASE_TEST_PROJECT_REF: aqzdibfpynakthvnhpzx
          SUPABASE_PRODUCTION_PROJECT_REF: ofaraxqrpcdiregxjyyb
          SUPABASE_TEST_ENV: isolated
          REQUIRE_LIVE_SUPABASE_TESTS: "true"
          SUPABASE_URL: ${{ secrets.SUPABASE_TEST_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_TEST_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_TEST_SERVICE_ROLE_KEY }}
          NODE_OPTIONS: --require ./tests/helpers/test-network-guard.cjs
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'ci-test-jwt-secret-min-32-chars-long-centrly' }}
          NODE_ENV: test
        run: |
          set -o pipefail
          npm test | tee /tmp/centrly-test-results.tap
          grep -Eq '^# skipped 0$' /tmp/centrly-test-results.tap

      - name: Verify No Raw SQL Interpolation
        run: |
          echo "Scanning for raw SQL string interpolation in application code..."
          if grep -rnE "(\`.*(SELECT|INSERT|UPDATE|DELETE).*\`|\$\{.*(SELECT|INSERT|UPDATE|DELETE))" apps/tutoring/src/; then
            echo "ERROR: Potential unparameterized SQL interpolation detected!"
            exit 1
          else
            echo "PASS: Zero unparameterized SQL interpolation found across codebase."
          fi
