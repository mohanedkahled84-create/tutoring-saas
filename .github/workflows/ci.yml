name: CI Quality Gate

on:
  push:
    branches:
      - main
      - 'audit/**'
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-quality-gate:
    name: Backend Quality Gate (Lint, Build, Test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/tutoring

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: apps/tutoring/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Linter
        run: npm run lint

      - name: Run TypeScript Build
        run: npm run build

      - name: Run Test Suite
        env:
          NODE_ENV: test
          SUPABASE_URL: https://mock-supabase.local
          SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.mock_anon_key
          SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.mock_service_role_key
          JWT_SECRET: test_jwt_secret_key_32_chars_long_minimum_required
        run: npm test
